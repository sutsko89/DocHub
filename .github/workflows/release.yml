name: Release

# Сборка релизных артефактов (аудит 2.0.1, P1 «поставка не подписана, сборка
# не в CI»): PyInstaller + Inno Setup на windows-latest, SHA-256 рядом с артефактами.
# Триггеры: ручной запуск и теги вида v2.1.0.
#
# Подпись (2.16.0): шаги signtool выполняются автоматически, когда в секретах
# репозитория заданы SIGN_CERT_PFX (base64 сертификата .pfx) и
# SIGN_CERT_PASSWORD. Подписываются EW.DocHub.exe и setup.exe с RFC-3161
# таймштампом (SHA-256). Секретов нет — шаги пропускаются, сборка остаётся
# рабочей. Инструкции по получению сертификата — в README («Подпись кода»).
# После включения подписи SmartScreen перестаёт показывать «неизвестный издатель».

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Публикация релиза (2.15.0): на тегах setup.exe и SHA-256 выкладываются
# в GitHub Releases встроенным GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Windows — exe + установщик + SHA-256
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      # Секреты подписи (2.16.0): пустые — шаги signtool пропускаются.
      SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Зависимости
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest (без интерфейса)
        run: python -m pytest tests/

      - name: smoke_test.py (графическая сессия)
        run: python smoke_test.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Сборка приложения (PyInstaller)
        run: pyinstaller --noconfirm EWDochub.spec

      - name: Подпись EW.DocHub.exe (signtool, опционально)
        if: env.SIGN_CERT_PFX != '' && env.SIGN_CERT_PASSWORD != ''
        run: |
          ./tools/sign_artifact.ps1 "dist\EW.DocHub\EW.DocHub.exe"

      - name: Сборка установщика (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 7\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден после установки Inno Setup" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершился с ошибкой $LASTEXITCODE" }

      - name: Подпись setup.exe (signtool, опционально)
        if: env.SIGN_CERT_PFX != '' && env.SIGN_CERT_PASSWORD != ''
        run: |
          $setup = Get-ChildItem "installer\*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Установщик не найден в installer\" }
          ./tools/sign_artifact.ps1 $setup.FullName

      - name: SHA-256 артефактов (после подписи)
        run: |
          $setup = Get-ChildItem "installer\*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Установщик не найден в installer\" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -Encoding ascii "installer\SHA256SUMS.txt"
          Get-Content "installer\SHA256SUMS.txt"

      - name: Артефакты релиза
        uses: actions/upload-artifact@v4
        with:
          name: EW.DocHub-release
          path: |
            installer/*-setup.exe
            installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Публикация GitHub Release (только теги)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: EW.DocHub ${{ github.ref_name }}
          files: |
            installer/*-setup.exe
            installer/SHA256SUMS.txt
          body: |
            Установщик Windows: скачать **EW.DocHub-*-setup.exe** ниже и запустить.
            Контрольная сумма SHA-256 — в файле `SHA256SUMS.txt` рядом с установщиком.

            Требования: Windows 10/11 x64. После установки в программе нет ни данных,
            ни ключей — реестр пуст, ключ DaData вводится в «Настройках» (п. 6.1).
            Проверка новых версий — «Настройки → Обновления» (2.15.0).

            Установщик не подписан сертификатом: SmartScreen может показать
            «неизвестный издатель» — «Подробнее → Выполнить в любом случае».
          fail_on_unmatched_files: true

# Публикация в GitHub Releases (шаг softprops/action-gh-release выше) — на тегах
# с 2.15.0. Подпись артефактов — шагами sign_artifact.ps1 (2.16.0): при заданных
# секретах SIGN_CERT_PFX/SIGN_CERT_PASSWORD в release попадает уже подписанный
# setup.exe, SHA-256 считается по подписанному файлу.
