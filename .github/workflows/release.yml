name: Release

# Сборка релизных артефактов (аудит 2.0.1, P1 «поставка не подписана, сборка
# не в CI»): PyInstaller + Inno Setup на windows-latest, SHA-256 рядом с артефактами.
# Триггеры: ручной запуск и теги вида v2.1.0.
#
# Подпись (2.16.0): шаги signtool выполняются автоматически, когда в секретах
# репозитория заданы SIGN_CERT_PFX (base64 сертификата .pfx) и
# SIGN_CERT_PASSWORD. Подписываются EW.DocHub.exe и setup.exe с RFC-3161
# таймштампом (SHA-256). Секретов нет — шаги пропускаются, сборка остаётся
# рабочей. Инструкции по получению сертификата — в README («Подпись кода»).
# После включения подписи SmartScreen перестаёт показывать «неизвестный издатель».

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Публикация релиза (2.15.0): на тегах setup.exe и SHA-256 выкладываются
# в GitHub Releases встроенным GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Windows — exe + установщик + SHA-256
    runs-on: windows-latest
    # 180 мин (замер v2.29.0 на windows-latest): pytest ~74 мин (diag af79444),
    # на медленных раннерах ~100+ мин; далее smoke Tk/Qt, две сборки
    # PyInstaller и два Inno Setup — суммарно нужен запас (прогон 120 мин
    # сняли на лимите во время сборок).
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      # Секреты подписи (2.16.0): пустые — шаги signtool пропускаются.
      SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (P2-14: пин по SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (P2-14)
        with:
          python-version: "3.13"
          cache: pip

      - name: Зависимости
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest (без интерфейса)
        run: python -m pytest tests/

      - name: smoke_test.py (графическая сессия, Tk-сборка)
        run: python smoke_test.py
        env:
          PYTHONIOENCODING: utf-8

      - name: smoke_qt.py (графическая сессия, Qt-сборка, M7)
        run: python smoke_qt.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Сборка Tk-версии (PyInstaller)
        run: pyinstaller --noconfirm EWDochub.spec

      - name: Сборка Qt-версии (PyInstaller, M7)
        run: |
          pyinstaller --noconfirm EWDochub_qt.spec
          if (-not (Test-Path "dist\EW.DocHub-qt\EW.DocHub-qt.exe")) { throw "Qt-сборка не содержит EW.DocHub-qt.exe — проверьте EWDochub_qt.spec (Qt-плагины/datas)" }

      - name: Подпись EW.DocHub.exe / EW.DocHub-qt.exe (signtool, опционально)
        if: env.SIGN_CERT_PFX != '' && env.SIGN_CERT_PASSWORD != ''
        run: |
          ./tools/sign_artifact.ps1 "dist\EW.DocHub\EW.DocHub.exe"
          ./tools/sign_artifact.ps1 "dist\EW.DocHub-qt\EW.DocHub-qt.exe"

      - name: Сборка установщиков (Inno Setup — Tk и Qt, M7)
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 7\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден после установки Inno Setup" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup (Tk) завершился с ошибкой $LASTEXITCODE" }
          & $iscc installer_qt.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup (Qt) завершился с ошибкой $LASTEXITCODE" }

      - name: Подпись setup.exe (signtool, опционально — оба флейвора)
        if: env.SIGN_CERT_PFX != '' && env.SIGN_CERT_PASSWORD != ''
        run: |
          $setups = Get-ChildItem "installer\*-setup.exe"
          if (-not $setups) { throw "Установщики не найдены в installer\" }
          foreach ($setup in $setups) { ./tools/sign_artifact.ps1 $setup.FullName }

      - name: SHA-256 артефактов (после подписи, оба ассета — И.2)
        run: |
          # SHA256SUMS.txt перечисляет ОБА ассета релиза (Tk + Qt): приложение
          # выбирает ассет своего флейвора (updater.installer_asset_for_flavor).
          $setups = Get-ChildItem "installer\*-setup.exe"
          if (-not $setups) { throw "Установщики не найдены в installer\" }
          Remove-Item "installer\SHA256SUMS.txt" -ErrorAction SilentlyContinue
          foreach ($setup in $setups) {
            $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($setup.Name)" | Out-File -Encoding ascii -Append "installer\SHA256SUMS.txt"
          }
          Get-Content "installer\SHA256SUMS.txt"

      - name: Артефакты релиза
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (P2-14)
        with:
          name: EW.DocHub-release
          path: |
            installer/*-setup.exe
            installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Публикация GitHub Release (только теги)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 (P2-14)
        with:
          name: EW.DocHub ${{ github.ref_name }}
          files: |
            installer/*-setup.exe
            installer/SHA256SUMS.txt
          # Тело релиза — подготовленный текст (шаг 3 отчёта M8): CI публикует
          # релиз сразу с полными примечаниями из docs/RELEASE_NOTES_v2.29.0.md.
          body_path: docs/RELEASE_NOTES_v2.29.0.md
          fail_on_unmatched_files: true

# Публикация в GitHub Releases (шаг softprops/action-gh-release выше) — на тегах
# с 2.15.0. Подпись артефактов — шагами sign_artifact.ps1 (2.16.0): при заданных
# секретах SIGN_CERT_PFX/SIGN_CERT_PASSWORD в release попадает уже подписанный
# setup.exe, SHA-256 считается по подписанному файлу.
