name: CI

# pytest без интерфейса + smoke: на Linux — под Xvfb, на Windows — в
# графической сессии раннера. Аудит 2.0.1 (P1): целевая платформа продукта —
# Windows — обязана проверять 280+ GUI-инвариантов до релиза, а не только pytest.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — pytest + smoke (Xvfb)
    runs-on: ubuntu-latest
    # 30 мин (релизный прогон v2.29.0): pytest 1181 тестов + smoke Tk + smoke Qt
    # не влезают в прежние 20 мин, рассчитанные на Tk-эру (855 тестов).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (P2-14: пин по SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (P2-14)
        with:
          python-version: "3.13"
          cache: pip
      # Системные Qt-библиотеки (релизный прогон v2.29.0, run CI на main):
      # без libEGL.so.1 импорт QtGui в pytest-qt падает INTERNALERROR до сбора
      # тестов; libgl/xkbcommon/dbus/fontconfig нужны рендерингу под Xvfb.
      - name: Xvfb и системные Qt-библиотеки для smoke/pytest-qt
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Зависимости
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (без интерфейса)
        run: python -m pytest tests/ --cov=storage --cov=document_importer
             --cov=document_builder --cov=services --cov-report=term-missing
      - name: smoke_test.py (интерфейс под Xvfb)
        run: xvfb-run -a -s "-screen 0 1280x800x24" python smoke_test.py
      - name: smoke_qt.py (Qt-сборка под Xvfb, M7)
        run: xvfb-run -a -s "-screen 0 1280x800x24" python smoke_qt.py

  windows:
    name: Windows — pytest + smoke (GUI-сессия)
    runs-on: windows-latest
    # 75 мин (релизный прогон v2.29.0): на windows-latest pytest 1181 тестов
    # не уложился в прежние 35 мин (задание снято на лимите); далее smoke ×2
    # и контрольная сборка PyInstaller — суммарно нужен запас.
    timeout-minutes: 75
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (P2-14: пин по SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (P2-14)
        with:
          python-version: "3.13"
          cache: pip
      - name: Зависимости
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (без интерфейса)
        run: python -m pytest tests/
      - name: smoke_test.py (графическая сессия Windows, без Xvfb)
        run: python smoke_test.py
      - name: smoke_qt.py (графическая сессия Windows, M7)
        run: python smoke_qt.py
      - name: Контрольная сборка Qt-версии (PyInstaller, M7)
        run: |
          pyinstaller --noconfirm EWDochub_qt.spec
          if (-not (Test-Path "dist\EW.DocHub-qt\EW.DocHub-qt.exe")) { throw "Qt-сборка не содержит EW.DocHub-qt.exe (Qt-плагины/datas)" }

# TODO (аудит 2.0.1, P2): закрепить actions/checkout и setup-python по SHA,
# а не по major-тегу — проверить актуальные SHA и обновить оба jobs.
