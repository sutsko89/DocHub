name: CI

# П. 7.9 плана: pytest без интерфейса + smoke под Xvfb на Linux,
# pytest на Windows-раннере (там есть графическая сессия).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux — pytest + smoke (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Xvfb для smoke-теста
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Зависимости
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (без интерфейса)
        run: python -m pytest tests/ --cov=storage --cov=document_importer
             --cov=document_builder --cov=services --cov-report=term-missing
      - name: smoke_test.py (интерфейс под Xvfb)
        run: xvfb-run -a -s "-screen 0 1280x800x24" python smoke_test.py

  windows:
    name: Windows — pytest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Зависимости
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (без интерфейса)
        run: python -m pytest tests/
